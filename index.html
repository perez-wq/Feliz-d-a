<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>❤️ Feliz Día de la Novia ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
height:100vh;
background:radial-gradient(circle at top,#1b0033,#000814,#000);
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
}

canvas{
position:absolute;
inset:0;
}

#mensaje{

position:absolute;

text-align:center;

opacity:0;

animation:aparece 4s forwards 2s;

}

#mensaje h1{

color:white;

font-size:55px;

text-shadow:0 0 25px hotpink;

}

#mensaje p{

margin-top:15px;

font-size:35px;

color:#ff8fd1;

text-shadow:0 0 20px deeppink;

}

@keyframes aparece{

0%{

opacity:0;

transform:scale(.2);

}

100%{

opacity:1;

transform:scale(1);

}

}

</style>

</head>

<body>

<canvas id="c"></canvas>

<div id="mensaje">

<h1>❤️ Feliz Día de la Novia ❤️</h1>

<p>💖 Mi niña TQM 💖</p>

</div>

<script>

const canvas=document.getElementById("c");

const ctx=canvas.getContext("2d");

function resize(){

canvas.width=innerWidth;

canvas.height=innerHeight;

}

resize();

addEventListener("resize",resize);

const stars=[];

for(let i=0;i<250;i++){

stars.push({

x:Math.random()*canvas.width,

y:Math.random()*canvas.height,

r:Math.random()*2,

a:Math.random()

});

}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

for(const s of stars){

ctx.beginPath();

ctx.fillStyle="rgba(255,255,255,"+s.a+")";

ctx.arc(s.x,s.y,s.r,0,Math.PI*2);

ctx.fill();

s.a+=((Math.random()-.5)*0.03);

if(s.a<0.2)s.a=0.2;

if(s.a>1)s.a=1;

}

requestAnimationFrame(draw);

}

draw();

</script>

</body>

</html>
<div class="mensaje">
  <h1>❤️ Feliz Día de la Novia ❤️</h1>
  <h2>💖 Mi niña TQM 💖</h2>
</div>

<script>
function crearEstrella(){
  const s=document.createElement("div");
  s.className="star";
  s.innerHTML="✦";
  s.style.left=Math.random()*100+"vw";
  s.style.top=Math.random()*100+"vh";
  s.style.fontSize=(Math.random()*6+4)+"px";
  document.body.appendChild(s);

  setTimeout(()=>s.remove(),8000);
}

function crearCorazon(){
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="❤️";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=(Math.random()*4+4)+"s";
  h.style.fontSize=(Math.random()*25+15)+"px";
  document.body.appendChild(h);

  setTimeout(()=>h.remove(),8000);
}

setInterval(crearEstrella,100);
setInterval(crearCorazon,150);
</script>

</body>
</html>
