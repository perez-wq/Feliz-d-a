<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Día de la Novia</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial,sans-serif;
}

h1{
position:absolute;
text-align:center;
color:white;
font-size:3em;
text-shadow:0 0 20px hotpink;
animation:aparece 3s ease forwards;
opacity:0;
z-index:10;
}

h1 span{
display:block;
font-size:0.7em;
margin-top:15px;
color:#ff8ecf;
}

@keyframes aparece{
0%{opacity:0;transform:scale(.3);}
100%{opacity:1;transform:scale(1);}
}

.heart{
position:absolute;
color:#ff3b7d;
font-size:20px;
animation:subir linear infinite;
}

@keyframes subir{
0%{
transform:translateY(100vh) scale(.5);
opacity:0;
}
20%{
opacity:1;
}
100%{
transform:translateY(-120vh) scale(1.3);
opacity:0;
}
}

.star{
position:absolute;
background:white;
border-radius:50%;
animation:brillo 2s infinite alternate;
}

@keyframes brillo{
from{opacity:.2;}
to{opacity:1;}
}
</style>

</head>
<body>

<h1>
❤️ Feliz Día de la Novia ❤️
<span>💖 Mi niña TQM 💖</span>
</h1>

<script>

for(let i=0;i<120;i++){
let s=document.createElement("div");
s.className="star";
let size=Math.random()*3+1;
s.style.width=size+"px";
s.style.height=size+"px";
s.style.left=Math.random()*100+"vw";
s.style.top=Math.random()*100+"vh";
document.body.appendChild(s);
}

function crearCorazon(){

let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";

h.style.left=Math.random()*100+"vw";
h.style.animationDuration=(Math.random()*4+4)+"s";
h.style.fontSize=(Math.random()*25+15)+"px";

document.body.appendChild(h);

setTimeout(()=>{
h.remove();
},8000);

}

setInterval(crearCorazon,150);

</script>

</body>
</html>
